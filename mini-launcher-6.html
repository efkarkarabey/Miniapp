<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MiniApp Başlatıcı</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --card: #1c1c22;
    --border: #2a2a35;
    --accent: #6c63ff;
    --accent2: #ff6b6b;
    --accent3: #43e97b;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* ── HEADER ── */
  header {
    padding: 20px 20px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }
  .add-btn {
    width: 44px; height: 44px;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, opacity .15s;
    box-shadow: 0 4px 20px rgba(108,99,255,.4);
  }
  .add-btn:active { transform: scale(.92); opacity: .85; }

  /* ── GRID ── */
  .grid-wrap {
    padding: 20px;
  }
  .section-label {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .app-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  /* ── APP CARD ── */
  .app-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    position: relative;
    animation: popIn .3s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes popIn {
    from { opacity:0; transform: scale(.7) translateY(10px); }
    to   { opacity:1; transform: scale(1) translateY(0); }
  }
  .app-icon {
    width: 72px; height: 72px;
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    position: relative;
    overflow: hidden;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 6px 24px rgba(0,0,0,.4);
  }
  .app-card:active .app-icon { transform: scale(.88); }
  .app-icon img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 20px;
  }
  .app-icon::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.12) 0%, transparent 60%);
    pointer-events: none;
  }
  .app-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    text-align: center;
    max-width: 72px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* delete badge */
  .delete-badge {
    position: absolute;
    top: -6px; right: 0px;
    width: 22px; height: 22px;
    background: var(--accent2);
    border-radius: 50%;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    line-height: 22px;
    text-align: center;
    display: none;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(255,107,107,.5);
  }
  body.edit-mode .delete-badge { display: block; }
  body.edit-mode .app-card .app-icon { animation: wiggle .4s infinite alternate; }
  @keyframes wiggle {
    from { transform: rotate(-2deg); }
    to   { transform: rotate(2deg); }
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    grid-column: 1/-1;
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* ── EDIT MODE BANNER ── */
  .edit-banner {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--accent2);
    color: #fff;
    text-align: center;
    padding: 14px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    z-index: 200;
    cursor: pointer;
    letter-spacing: .5px;
  }
  body.edit-mode .edit-banner { display: block; }

  /* ── MODAL ── */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 300;
    align-items: flex-start;
    overflow-y: auto;
  }
  .modal-bg.open { display: flex; }
  .modal {
    width: 100%;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    animation: slideUp .25s ease;
  }
  .modal-header {
    padding: 24px 24px 0;
    flex-shrink: 0;
  }
  .modal-scroll {
    overflow-y: auto;
    padding: 0 24px;
    flex: 1;
    -webkit-overflow-scrolling: touch;
  }
  .modal-footer {
    padding: 16px 24px 40px;
    flex-shrink: 0;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 20px;
    text-align: center;
  }
  .field-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .field-row { margin-bottom: 16px; }
  input[type=text], input[type=url] {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); }

  /* emoji picker row */
  .emoji-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .emoji-opt {
    width: 48px; height: 48px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 14px;
    font-size: 24px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, transform .15s;
  }
  .emoji-opt:active { transform: scale(.88); }
  .emoji-opt.selected { border-color: var(--accent); background: rgba(108,99,255,.15); }

  /* color row */
  .color-row {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .color-dot {
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform .15s;
    position: relative;
  }
  .color-dot:active { transform: scale(.88); }
  .color-dot.selected::after {
    content: '✓';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
  }

  .save-btn {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 16px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    letter-spacing: .5px;
    box-shadow: 0 6px 24px rgba(108,99,255,.4);
    transition: transform .15s, opacity .15s;
  }
  .save-btn:active { transform: scale(.97); opacity: .85; }
  .cancel-link {
    display: block;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-top: 14px;
    cursor: pointer;
  }

  /* ── VIEWER (mini browser) ── */
  .viewer {
    display: none;
    position: fixed; inset: 0;
    z-index: 400;
    flex-direction: column;
    background: #000;
  }
  .viewer.open { display: flex; }
  .viewer-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    min-height: 56px;
  }
  .viewer-back {
    width: 40px; height: 40px;
    border: none;
    background: var(--card);
    border-radius: 12px;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .viewer-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .viewer-open-btn {
    flex-shrink: 0;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .viewer iframe {
    flex: 1;
    border: none;
    width: 100%;
    background: #fff;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--accent3);
    color: #0d1f14;
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all .3s;
    pointer-events: none;
    z-index: 500;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Mini<span>App</span></div>
    <button class="add-btn" id="openModalBtn" title="Uygulama Ekle">+</button>
  </div>
</header>

<div class="grid-wrap">
  <div class="section-label">Uygulamalarım</div>
  <div class="app-grid" id="appGrid"></div>
</div>

<div class="edit-banner" id="editBanner">✓ Düzenlemeyi Bitir</div>

<!-- ADD MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;">
        <button id="cancelBtnTop" style="background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;padding:0;line-height:1;">←</button>
        <div class="modal-title" style="margin-bottom:0;">Yeni Uygulama</div>
      </div>
      <div class="field-row">
        <div class="field-label">Uygulama Adı</div>
        <input type="text" id="appName" placeholder="ör. Haberler, YouTube…" maxlength="24">
      </div>
    </div>
    <div class="modal-scroll">
      <div class="field-row">
        <div class="field-label">Web Adresi (URL)</div>
        <input type="url" id="appUrl" placeholder="https://…">
      </div>
      <div class="field-row">
        <div class="field-label">İkon Seç</div>
        <div class="emoji-row" id="emojiRow"></div>
      </div>
      <div class="field-row">
        <div class="field-label">Renk</div>
        <div class="color-row" id="colorRow"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="save-btn" id="saveBtn">Kaydet</button>
      <span class="cancel-link" id="cancelBtn">İptal</span>
    </div>
  </div>
</div>

<!-- MINI VIEWER -->
<div class="viewer" id="viewer">
  <div class="viewer-bar">
    <button class="viewer-back" id="viewerBack">←</button>
    <div class="viewer-title" id="viewerTitle"></div>
    <button class="viewer-open-btn" id="viewerOpenBtn">Tarayıcıda Aç ↗</button>
  </div>
  <iframe id="viewerFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
const EMOJIS = ['🔧','🔨','🪛','⚙️','🪚','🔩','🪝','🧱','🪟','🚿','🔌','💡','🧰','🏗️','🪜','👷','🧑‍🔧','👨‍🏭','🧑‍🍳','✂️','🧵','🪡','🧶','🎨','🖌️','🚗','🛞','🔋','🌐','📋'];
const COLORS = ['#6c63ff','#ff6b6b','#43e97b','#f7971e','#0abde3','#e84393','#a29bfe','#00cec9','#fd79a8','#55efc4','#b2bec3','#2d3436'];

let apps = JSON.parse(localStorage.getItem('miniapps') || '[]');
let selectedEmoji = EMOJIS[0];
let selectedColor = COLORS[0];

// ── BUILD PICKER ──
const emojiRow = document.getElementById('emojiRow');
EMOJIS.forEach(e => {
  const d = document.createElement('div');
  d.className = 'emoji-opt' + (e === selectedEmoji ? ' selected' : '');
  d.textContent = e;
  d.onclick = () => {
    selectedEmoji = e;
    document.querySelectorAll('.emoji-opt').forEach(x => x.classList.remove('selected'));
    d.classList.add('selected');
  };
  emojiRow.appendChild(d);
});

const colorRow = document.getElementById('colorRow');
COLORS.forEach(c => {
  const d = document.createElement('div');
  d.className = 'color-dot' + (c === selectedColor ? ' selected' : '');
  d.style.background = c;
  d.onclick = () => {
    selectedColor = c;
    document.querySelectorAll('.color-dot').forEach(x => x.classList.remove('selected'));
    d.classList.add('selected');
  };
  colorRow.appendChild(d);
});

// ── RENDER GRID ──
function renderGrid() {
  const grid = document.getElementById('appGrid');
  grid.innerHTML = '';
  if (!apps.length) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">📱</div><p>Henüz uygulama yok.<br>+ butonuna basarak ekle.</p></div>';
    return;
  }
  apps.forEach((app, i) => {
    const card = document.createElement('div');
    card.className = 'app-card';
    card.style.animationDelay = (i * 40) + 'ms';

    const icon = document.createElement('div');
    icon.className = 'app-icon';
    icon.style.background = app.color || '#6c63ff';
    icon.textContent = app.emoji || '🌐';

    // favicon fallback
    const faviconImg = document.createElement('img');
    const host = (() => { try { return new URL(app.url).hostname; } catch { return null; } })();
    if (host) {
      faviconImg.src = `https://www.google.com/s2/favicons?sz=128&domain=${host}`;
      faviconImg.style.cssText = 'display:none;width:100%;height:100%;object-fit:cover;border-radius:20px;';
      faviconImg.onload = () => {
        if (faviconImg.naturalWidth > 16) {
          icon.textContent = '';
          faviconImg.style.display = 'block';
          icon.appendChild(faviconImg);
        }
      };
      icon.appendChild(faviconImg);
    }

    const del = document.createElement('div');
    del.className = 'delete-badge';
    del.textContent = '×';
    del.onclick = (e) => {
      e.stopPropagation();
      apps.splice(i, 1);
      save();
      renderGrid();
    };

    const name = document.createElement('div');
    name.className = 'app-name';
    name.textContent = app.name;

    card.appendChild(icon);
    card.appendChild(del);
    card.appendChild(name);

    card.addEventListener('click', () => {
      if (document.body.classList.contains('edit-mode')) return;
      window.open(app.url, '_blank');
    });

    let holdTimer;
    card.addEventListener('touchstart', () => {
      holdTimer = setTimeout(() => { document.body.classList.add('edit-mode'); }, 600);
    }, { passive: true });
    card.addEventListener('touchend', () => clearTimeout(holdTimer), { passive: true });

    grid.appendChild(card);
  });
}

// ── SAVE ──
function save() { localStorage.setItem('miniapps', JSON.stringify(apps)); }

// ── MODAL ──
document.getElementById('openModalBtn').onclick = () => {
  document.getElementById('appName').value = '';
  document.getElementById('appUrl').value = '';
  document.getElementById('modalBg').classList.add('open');
};
document.getElementById('cancelBtn').onclick = () => document.getElementById('modalBg').classList.remove('open');
document.getElementById('cancelBtnTop').onclick = () => document.getElementById('modalBg').classList.remove('open');
document.getElementById('modalBg').onclick = (e) => {
  if (e.target === document.getElementById('modalBg')) document.getElementById('modalBg').classList.remove('open');
};

document.getElementById('saveBtn').onclick = () => {
  const name = document.getElementById('appName').value.trim();
  let url = document.getElementById('appUrl').value.trim();
  if (!name) { showToast('Uygulama adı girin'); return; }
  if (!url) { showToast('URL girin'); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  apps.push({ name, url, emoji: selectedEmoji, color: selectedColor, id: Date.now() });
  save();
  renderGrid();
  document.getElementById('modalBg').classList.remove('open');
  showToast('✓ Eklendi!');
};

// ── VIEWER ──
function openViewer(app) {
  document.getElementById('viewerTitle').textContent = app.name;
  document.getElementById('viewerFrame').src = app.url;
  document.getElementById('viewerOpenBtn').onclick = () => window.open(app.url, '_blank');
  document.getElementById('viewer').classList.add('open');
}
document.getElementById('viewerBack').onclick = () => {
  document.getElementById('viewer').classList.remove('open');
  document.getElementById('viewerFrame').src = '';
};

// ── EDIT MODE ──
document.getElementById('editBanner').onclick = () => document.body.classList.remove('edit-mode');

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── INIT ──
renderGrid();
</script>
</body>
</html>
